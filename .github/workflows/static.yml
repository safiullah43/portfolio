name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (clean install)
        id: install
        run: |
          if [ -f package-lock.json ]; then
            echo "Cleaning node_modules and package-lock.json for fresh install"
            rm -rf node_modules package-lock.json
            npm install
          else
            echo "No lockfile -> using npm install"
            npm install
          fi

      - name: Build (only if src/ exists)
        id: build
        run: |
          if [ -d src ]; then
            echo "src/ found — running build"
            npm run build
          else
            echo "No src/ directory found — skipping build"
          fi

      - name: Show filesystem (debug)
        run: |
          echo "Root files:" && ls -la
          echo "dist exists?:" && [ -d dist ] && echo "yes" || echo "no"

      - name: Determine artifact path
        id: set_path
        run: |
          if [ -d dist ]; then
            echo "path=dist" >> $GITHUB_OUTPUT
          elif [ -d build ]; then
            echo "path=build" >> $GITHUB_OUTPUT
          else
            echo "path=." >> $GITHUB_OUTPUT
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.set_path.outputs.path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
