name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies (use ci if lockfile exists)
        id: install
        run: |
          if [ -f package-lock.json ]; then
            echo "Using npm ci (lockfile found)"
            npm ci
          else
            echo "No lockfile -> using npm install --no-optional"
            npm install --no-optional
          fi

      - name: Rebuild native modules (attempt recovery for native bindings)
        run: |
          echo "Running npm rebuild to try to restore native bindings"
          npm rebuild --no-progress || true

      - name: Build (only if src/ exists)
        id: build
        run: |
          if [ -d src ]; then
            echo "src/ found — running build"
            npm run build
          else
            echo "No src/ directory found — skipping build"
          fi

      - name: Show filesystem (debug)
        run: |
          echo "Root files:" && ls -la
          echo "dist exists?:"
          if [ -d dist ]; then
            echo "yes"
            ls -la dist | sed -n '1,200p'
          else
            echo "no"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
